<!DOCTYPE html>
<html>
<head>
 

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
    }

    h2 {
      margin-bottom: 12px;
    }

    #users {
      list-style: none;
      padding: 0;
    }

    #users li {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    .loading {
      color: gray;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

<h2>User List</h2>

<div id="status" class="loading">Loading users...</div>

<ul id="users"></ul>

<script>
(async function () {

  const statusEl = document.getElementById("status");
  const usersEl = document.getElementById("users");

  const sdk = new window.WidgetServiceSDK();

  try {

    const users = await sdk.connectors.execute({
      permalink: "users-list", 
      method: "GET"
    });

    statusEl.style.display = "none";

    if (!Array.isArray(users)) {
      statusEl.innerText = "No users found";
      statusEl.style.display = "block";
      return;
    }

    users.forEach(user => {

      const li = document.createElement("li");

      li.innerHTML =
        "<strong>" + user.name + "</strong><br>" +
        "<small>" + user.email + "</small>";

      usersEl.appendChild(li);

    });

  } catch (error) {

    statusEl.innerText = "Failed to load users";
    statusEl.className = "error";
    console.error(error);

  }

})();
</script>

</body>
</html>
